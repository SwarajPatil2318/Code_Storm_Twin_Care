<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TwinCare · Medical Records</title><link rel="stylesheet" href="/records.css"><script type="module" src="/records.js"></script></head>
<body><header class="topbar"><a href="/" class="brand"><span aria-hidden="true">♡</span> TwinCare</a><span class="surface-label">Patient care</span><a class="twin-link" href="http://127.0.0.1:8097">Open Twin dashboard ↗</a></header>
<div class="workspace"><aside class="patients"><div class="eyebrow">Your patients</div><button id="new-patient" class="secondary">＋ Add patient</button><div id="patient-list" aria-label="Patients"></div><p class="privacy-note">Records belong to the selected patient. Information is saved to their profile only after your confirmation.</p></aside><main id="main"><div id="notice" role="status" aria-live="polite"></div><div id="content"></div></main></div>
<dialog id="edit-dialog" aria-labelledby="edit-title"><form id="edit-form"><h2 id="edit-title">Edit information</h2><p class="muted">Your original extraction and source will be retained.</p><div id="edit-fields"></div><p id="edit-error" role="alert"></p><div class="dialog-actions"><button type="button" id="cancel-edit" class="secondary">Cancel</button><button type="submit" class="primary">Save correction</button></div></form></dialog>
<dialog id="patient-dialog" aria-labelledby="patient-title"><form id="patient-form"><h2 id="patient-title">Add a patient</h2><label>Display name<input name="display_name" required maxlength="120" autocomplete="off"></label><label>Date of birth <span class="muted">optional</span><input name="date_of_birth" type="date"></label><label>Sex<select name="sex"><option value="unknown">Not recorded</option><option value="female">Female</option><option value="male">Male</option><option value="other">Other</option></select></label><p id="patient-error" role="alert"></p><div class="dialog-actions"><button id="cancel-patient" type="button" class="secondary">Cancel</button><button class="primary">Create patient</button></div></form></dialog>
</body></html>
