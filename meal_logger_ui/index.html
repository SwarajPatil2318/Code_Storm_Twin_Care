<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TwinCare · Meal Logger</title><link rel="stylesheet" href="/meals.css"><script type="module" src="/meals.js"></script></head><body>
<header><a class="brand" href="/">♡ <strong>TwinCare</strong></a><span>Patient care</span><a href="http://127.0.0.1:8097">Open Twin dashboard ↗</a></header><div id="notice" role="status" aria-live="polite"></div>
<div class="workspace"><aside><p class="eyebrow">YOUR PATIENTS</p><button id="new-patient">＋ Add patient</button><nav id="patients" aria-label="Patients"></nav><p class="aside-note">Meals belong to the selected patient and are saved after you confirm them.</p><a href="/data-connections">Data Connections ↗</a></aside><main id="main"></main></div>
<dialog id="patient-dialog" aria-labelledby="patient-title"><form id="patient-form"><h2 id="patient-title">Add a patient</h2><label>Display name<input name="display_name" maxlength="120" required></label><div class="actions"><button type="button" id="cancel-patient">Cancel</button><button class="primary">Create patient</button></div></form></dialog>
<dialog id="delete-dialog" aria-labelledby="delete-title"><h2 id="delete-title">Remove this meal?</h2><p>This removes the meal from current context. Its saved revision and audit history are retained.</p><div class="actions"><button id="cancel-delete">Cancel</button><button class="primary" id="confirm-delete">Remove meal</button></div></dialog>
</body></html>
